name: Desktop disposable Windows acceptance

# Installs unsigned test builds only. Does not authorize a signed production feed.
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful Desktop Windows build run on this exact main commit
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: desktop-windows-acceptance
  cancel-in-progress: false

jobs:
  verify-source:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sourceCommit: ${{ steps.source.outputs.sourceCommit }}
      runId: ${{ steps.source.outputs.runId }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Reject forks, PR artifacts, other workflows and other commits
        id: source
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node desktop/scripts/ci/verify-run.mjs
  acceptance:
    needs: verify-source
    environment: desktop-windows-acceptance
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win10-22h2-x64
            arch: x64
            os: win10-22h2
            runner:
              [
                self-hosted,
                Windows,
                X64,
                meetspace-disposable,
                meetspace-win10-22h2,
              ]
          - target: win11-x64
            arch: x64
            os: win11
            runner:
              [self-hosted, Windows, X64, meetspace-disposable, meetspace-win11]
          - target: win11-arm64
            arch: arm64
            os: win11
            runner:
              [
                self-hosted,
                Windows,
                ARM64,
                meetspace-disposable,
                meetspace-win11-arm64,
              ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-test-${{ matrix.arch }}-${{ needs.verify-source.outputs.sourceCommit }}
          path: desktop/artifacts/acceptance-input
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify-source.outputs.runId }}
      - name: Install, inspect, launch and uninstall in an isolated interactive account
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          TARGET_OS: ${{ matrix.os }}
          TARGET_NAME: ${{ matrix.target }}
        run: |
          $installers = @(Get-ChildItem -LiteralPath desktop/artifacts/acceptance-input -Filter "*-win-$env:TARGET_ARCH-test-setup.exe" -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one native unsigned test installer' }
          & desktop/scripts/windows-acceptance.ps1 -Installer $installers[0].FullName -ExpectedArchitecture $env:TARGET_ARCH -ExpectedOS $env:TARGET_OS -EvidenceDirectory "desktop/artifacts/acceptance-$env:TARGET_NAME" -DisposableAccount
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-acceptance-${{ matrix.target }}-${{ needs.verify-source.outputs.sourceCommit }}
          path: desktop/artifacts/acceptance-${{ matrix.target }}/**
          if-no-files-found: error
          retention-days: 30
