name: Desktop Windows build

on:
  push:
    branches: [main]
    paths: ["frontend/**", "desktop/**", ".github/workflows/desktop-*.yml"]
  pull_request:
    paths: ["frontend/**", "desktop/**", ".github/workflows/desktop-*.yml"]
  workflow_dispatch:

# Forks and PR code receive no signing/publishing environment or write token.
permissions:
  contents: read
concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unsigned Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Preserve checkout bytes across native architectures
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Verify native build process
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: node -e "if(process.platform!=='win32'||process.arch!==process.env.TARGET_ARCH)process.exit(1)"
      - name: Capture clean source and frozen lock inputs
        run: node desktop/scripts/ci/source-inputs.mjs desktop/artifacts/ci/source-inputs.json --require-clean
      - name: Verify local HTTPS fixture prerequisite
        run: desktop/scripts/ci/check-windows-tools.ps1
      - name: Install exact dependencies
        run: |
          npm ci --prefix frontend
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix desktop
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Validate shared web and desktop code
        run: |
          pwsh -NoProfile -File desktop/tests/windows-acceptance-structure.ps1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix frontend run check
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix frontend run check:desktop-foundation
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix frontend run check:desktop-media
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix frontend run check:desktop-assets
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm --prefix desktop test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build and inspect the actual NSIS payload
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: node desktop/scripts/package.mjs $env:TARGET_ARCH
      - name: Record native runner, unchanged inputs and dependency SBOMs
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: node desktop/scripts/ci/collect-build-evidence.mjs desktop/artifacts/ci $env:TARGET_ARCH
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-test-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/artifacts/*-win-${{ matrix.arch }}-test-setup.exe
            desktop/artifacts/*-win-${{ matrix.arch }}-test-setup.exe.sha256
            desktop/artifacts/*-win-${{ matrix.arch }}-test-setup.exe.json
            desktop/artifacts/ci/**
