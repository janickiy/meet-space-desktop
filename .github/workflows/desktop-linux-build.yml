name: Desktop Linux packages

on:
  push:
    branches: [main]
    paths: ["frontend/**", "desktop/**", ".github/workflows/desktop-*.yml"]
  pull_request:
    paths: ["frontend/**", "desktop/**", ".github/workflows/desktop-*.yml"]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: desktop-linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Linux ${{ matrix.arch }} test packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            gtk: libgtk-3-0
            alsa: libasound2
            fuse: libfuse2
          - arch: arm64
            # Ubuntu 22.04 permits the original AppImage sandbox without changing
            # AppArmor userns policy or adding --no-sandbox.
            runner: ubuntu-22.04-arm
            gtk: libgtk-3-0
            alsa: libasound2
            fuse: libfuse2
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - name: Install official build and inspection tools
        env:
          GTK_PACKAGE: ${{ matrix.gtk }}
          ALSA_PACKAGE: ${{ matrix.alsa }}
          FUSE_PACKAGE: ${{ matrix.fuse }}
        run: |
          sudo apt-get update
          sudo apt-get install --assume-yes --no-install-recommends rpm cpio squashfs-tools binutils desktop-file-utils libglib2.0-bin ripgrep xvfb xauth dbus-x11 libsecret-1-0 libnss3 libnotify4 libxss1 libxtst6 libgbm1 "$GTK_PACKAGE" "$ALSA_PACKAGE" "$FUSE_PACKAGE"
      - name: Record exact clean source and native Node architecture
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          node -e 'if(process.platform!=="linux"||process.arch!==process.env.TARGET_ARCH)process.exit(1)'
          node desktop/scripts/ci/source-inputs.mjs desktop/artifacts/linux-ci/source-inputs.json --require-clean
      - name: Install frozen dependencies and validate shared code
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop
          node desktop/node_modules/electron/install.js
          npm --prefix frontend run check
          npm --prefix frontend run check:desktop-foundation
          npm --prefix frontend run check:desktop-media
          npm --prefix frontend run check:desktop-assets
          npm --prefix desktop test
      - name: Build and statically verify the native Linux packages
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: node desktop/scripts/package-linux.mjs "$TARGET_ARCH"
      - name: Locate immutable verified outputs
        id: artifact
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const pkg=JSON.parse(readFileSync('desktop/package.json','utf8'));
          const source=JSON.parse(readFileSync('desktop/dist/source-inputs.json','utf8'));
          const root=`${process.cwd()}/desktop/artifacts/linux`;
          const suffix=`${pkg.version}/${source.sourceTreeSha256}/${process.env.TARGET_ARCH}`;
          appendFileSync(process.env.GITHUB_OUTPUT,`deb-directory=${root}/DEB/${suffix}\nappimage-directory=${root}/AppImage/${suffix}\n`);
          NODE
      - name: DEB install, controlled upgrade, reinstall, runtime smoke and remove
        env:
          ARTIFACT_DIRECTORY: ${{ steps.artifact.outputs.deb-directory }}
        run: |
          mapfile -t packages < <(find "$ARTIFACT_DIRECTORY" -maxdepth 1 -name '*.deb' -type f)
          [ "${#packages[@]}" = 1 ]
          dbus-run-session -- xvfb-run -a bash desktop/scripts/ci/linux-deb-acceptance.sh "${packages[0]}" "$PWD/desktop/artifacts/linux-ci/deb-acceptance" --disposable
      - name: Original AppImage sandboxed runtime smoke
        env:
          ARTIFACT_DIRECTORY: ${{ steps.artifact.outputs.appimage-directory }}
        run: |
          mapfile -t images < <(find "$ARTIFACT_DIRECTORY" -maxdepth 1 -name '*.AppImage' -type f)
          [ "${#images[@]}" = 1 ]
          dbus-run-session -- xvfb-run -a node desktop/tests/linux-installed-package-runner.cjs "${images[0]}" AppImage "$PWD/desktop/artifacts/linux-ci/appimage-smoke.json"
      - name: Record unchanged inputs and dependency inventories
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: node desktop/scripts/ci/collect-linux-build-evidence.mjs desktop/artifacts/linux-ci "$TARGET_ARCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-linux-test-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/artifacts/linux/**
            desktop/artifacts/linux-ci/**

  rpm-package-lifecycle:
    name: Fedora 44 ${{ matrix.arch }} RPM package lifecycle (container only)
    needs: packages
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            rpm-arch: x86_64
            docker-arch: amd64
          - arch: arm64
            runner: ubuntu-22.04-arm
            rpm-arch: aarch64
            docker-arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.19.0"
          architecture: ${{ matrix.arch }}
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-linux-test-${{ matrix.arch }}-${{ github.sha }}
          path: package-input
      - name: Install, reinstall and remove RPM without running Electron in a container
        env:
          TARGET_ARCH: ${{ matrix.arch }}
          RPM_ARCH: ${{ matrix.rpm-arch }}
          DOCKER_ARCH: ${{ matrix.docker-arch }}
        run: |
          node -e 'if(process.platform!=="linux"||process.arch!==process.env.TARGET_ARCH)process.exit(1)'
          test "$(uname -m)" = "$RPM_ARCH"
          source_sha="$(node -e 'const source=require("./package-input/linux-ci/source-inputs.json"); if(!/^[a-f0-9]{64}$/.test(source.sourceTreeSha256))process.exit(1); console.log(source.sourceTreeSha256)')"
          mapfile -t packages < <(find "$PWD/package-input/linux/RPM" -path "*/$source_sha/$TARGET_ARCH/*.rpm" -type f)
          [ "${#packages[@]}" = 1 ]
          mkdir rpm-evidence
          docker pull --platform "linux/$DOCKER_ARCH" fedora:44
          docker image inspect fedora:44 > rpm-evidence/container-image.json
          docker run --rm --platform "linux/$DOCKER_ARCH" -e EXPECTED_RPM_ARCH="$RPM_ARCH" -v "$(dirname "${packages[0]}"):/packages:ro" -v "$PWD/rpm-evidence:/evidence" fedora:44 bash -euo pipefail -c '
            cat /etc/os-release > /evidence/os-release
            test "$(uname -m)" = "$EXPECTED_RPM_ARCH"
            packages=(/packages/*.rpm)
            [ "${#packages[@]}" = 1 ]
            test "$(rpm -qp --qf "%{ARCH}" "${packages[0]}")" = "$EXPECTED_RPM_ARCH"
            if rpm -q meetspace-desktop-test; then
              echo "Refusing an existing MeetSpace installation" >&2
              exit 1
            fi
            mkdir -p /home/fixture/.config/meetspace-desktop
            echo fixture > /home/fixture/.config/meetspace-desktop/keep
            dnf -y install "${packages[0]}" > /evidence/install.log 2>&1
            rpm -q --qf "%{NAME} %{VERSION}-%{RELEASE} %{ARCH}\n" meetspace-desktop-test > /evidence/installed.txt
            test "$(stat -c %u:%g:%a "/opt/meetspace-desktop-test/chrome-sandbox")" = 0:0:4755
            test -f /usr/share/applications/com.janickiy.meetspace.desktop.test.desktop
            dnf -y reinstall "${packages[0]}" > /evidence/reinstall.log 2>&1
            dnf -y remove meetspace-desktop-test > /evidence/remove.log 2>&1
            test ! -e "/opt/meetspace-desktop-test/meetspace-test"
            test ! -e /usr/share/applications/com.janickiy.meetspace.desktop.test.desktop
            test "$(cat /home/fixture/.config/meetspace-desktop/keep)" = fixture
            echo "PASS: package install/reinstall/remove; no Electron runtime, version upgrade, full desktop, Wayland or login acceptance" > /evidence/result.txt
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: desktop-linux-rpm-container-${{ matrix.arch }}-${{ github.sha }}
          path: rpm-evidence/**
          if-no-files-found: error
          retention-days: 14
